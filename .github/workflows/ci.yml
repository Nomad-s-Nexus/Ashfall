name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  contracts:
    name: Contract tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"

      - name: Run contract tests
        run: |
          $ErrorActionPreference = 'Stop'
          # Constraint: verify_rad_stack_integration.py compiles a host C++ probe, so cl.exe must be on PATH.
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          # verify_ae_runtime_support.py needs the private CommonLib checkout, so it runs in the native job.
          $python = @(
            'verify_ci_deploy.py',
            'verify_mask_catalog.py deploy/RadiationOverhaul.esp',
            'verify_mask_extras.py',
            'verify_hud_fallback.py deploy/PrismaUI_F4/views/Interface/FalloutAnomaly/hud_toxic.html src/RadHud.cpp',
            'verify_local_hud_editor.py',
            'verify_ghoul_contract.py',
            'verify_storm_spawn_ownership.py',
            'verify_serialization_policy.py',
            'verify_needs_consumption_trace.py',
            'verify_climate_runtime.py',
            'verify_climate_protection_config.py',
            'verify_climate_protection_runtime.py',
            'verify_climate_heat_config.py',
            'verify_climate_weather_config.py',
            'verify_climate_hud.py',
            'verify_hud_layout_bridge.py',
            'verify_rad_shelter_cache.py',
            'verify_rad_stack_integration.py',
            'verify_survival.py',
            'verify_survival_diseases.py',
            'verify_survival_menu.py',
            'verify_needs_globals.py',
            'verify_av_ownership.py',
            'verify_papyrus_pex.py'
          )
          $failed = @()
          foreach ($t in $python) {
            Write-Host "::group::python tests/$t"
            python @(-split "tests/$t")
            if ($LASTEXITCODE -ne 0) { $failed += $t }
            Write-Host '::endgroup::'
          }
          foreach ($t in 'armor_diagnostics_tests.js', 'status_hud_tests.js') {
            Write-Host "::group::node tests/$t"
            node "tests/$t"
            if ($LASTEXITCODE -ne 0) { $failed += $t }
            Write-Host '::endgroup::'
          }
          if ($failed) { throw "contract tests failed: $($failed -join ', ')" }

  native:
    name: Native build (self-hosted Windows)
    needs: contracts
    # Constraint: the DLL links the private commonlib_NonVR checkout, which only a provisioned runner has.
    # Never on pull_request: a fork PR runs its own copy of this file, so any guard here could be edited away.
    # Same-repo pushes need write access. Off until the repo variable ASHFALL_NATIVE_BUILD is "true".
    if: vars.ASHFALL_NATIVE_BUILD == 'true' && github.event_name != 'pull_request'
    timeout-minutes: 60
    runs-on: [self-hosted, windows, ashfall]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify commonlib_NonVR reference
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $commonLibSha = 'ed383ff935eea00566a371eff0d6a97ae4bda548'
          $commonLib = $env:COMMONLIBF4_PATH
          if (-not $commonLib) { throw 'Runner COMMONLIBF4_PATH is not configured' }
          $pinned = (git -C $commonLib rev-parse HEAD).Trim()
          if ($pinned -ne $commonLibSha) { throw "commonlib_NonVR checkout $pinned does not match pin $commonLibSha" }
          if (git -C $commonLib status --porcelain --untracked-files=no) { throw 'CommonLib reference has tracked changes' }
          git -C $commonLib submodule foreach --recursive 'git diff --exit-code HEAD'
          $submodule = (git -C $commonLib submodule status --recursive) -join "`n"
          if ($submodule -match '(?m)^[+U-]') { throw 'CommonLib submodule does not match its pin' }
          if (-not (Test-Path (Join-Path $commonLib 'RE-Work') -PathType Container)) { throw 'CommonLib RE-Work marker missing' }
          Write-Host "commonlib_NonVR: $pinned"

      - name: Verify runner tools
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          xmake --version
          node --version
          python --version

      - name: CommonLib-dependent contract test
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python tests/verify_ae_runtime_support.py

      - name: Configure (MSVC)
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          xmake f -p windows -a x64 -m release --builddir=build-msvc -y

      - name: Build and run policy tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tests = @(
            'rad_correctness_policy_tests',
            'climate_policy_tests',
            'climate_weather_policy_tests',
            'climate_wetness_policy_tests',
            'needs_policy_tests',
            'needs_trace_policy_tests',
            'serialization_policy_tests'
          )
          foreach ($t in $tests) { xmake build -y $t }
          foreach ($t in $tests) { & ".\build\tests\$t.exe" }

      - name: Build
        run: xmake build -vD -y FalloutAnomalyRadiation

      - uses: actions/upload-artifact@v4
        with:
          name: FalloutAnomalyRadiation-windows-x64
          path: build/release/FalloutAnomalyRadiation.dll
          if-no-files-found: error
          retention-days: 7
