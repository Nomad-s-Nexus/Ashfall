name: Release

# Builds the DLL on the self-hosted Windows runner, packages deploy/ plus the fresh
# FalloutAnomalyRadiation.dll, and publishes a GitHub Release with the zip attached.
# Trigger: push a tag matching rad-overhaul-v* (for example rad-overhaul-v1.2.0).

on:
  push:
    tags:
      - "rad-overhaul-v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  disabled:
    name: Native build disabled
    if: vars.ASHFALL_NATIVE_BUILD != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::ASHFALL_NATIVE_BUILD is not true; no release was built for $GITHUB_REF_NAME"
          exit 1

  release:
    name: Build, package and publish
    # Constraint: needs the private commonlib_NonVR checkout, so it only runs once the self-hosted runner is enabled.
    if: vars.ASHFALL_NATIVE_BUILD == 'true'
    runs-on: [self-hosted, windows, ashfall]
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.ref_name }}
      ASSET: RadiationOverhaul-${{ github.ref_name }}.zip
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "tag $env:TAG is not reachable from main" }

      - name: Verify commonlib_NonVR reference
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Constraint: bump this SHA deliberately; the release must build the same CommonLib the CI build validated.
          $commonLibSha = 'ed383ff935eea00566a371eff0d6a97ae4bda548'
          $commonLib = $env:COMMONLIBF4_PATH
          if (-not $commonLib) { throw 'Runner COMMONLIBF4_PATH is not configured' }
          $pinned = (git -C $commonLib rev-parse HEAD).Trim()
          if ($pinned -ne $commonLibSha) { throw "commonlib_NonVR checkout $pinned does not match pin $commonLibSha" }
          if (git -C $commonLib status --porcelain --untracked-files=no) { throw 'CommonLib reference has tracked changes' }
          git -C $commonLib submodule foreach --recursive 'git diff --exit-code HEAD'
          $submodule = (git -C $commonLib submodule status --recursive) -join "`n"
          if ($submodule -match '(?m)^[+U-]') { throw 'CommonLib submodule does not match its pin' }
          if (-not (Test-Path (Join-Path $commonLib 'RE-Work') -PathType Container)) {
            throw 'RE-Work marker missing; checkout is not commonlib_NonVR'
          }
          Write-Host "commonlib_NonVR: $pinned"

      - name: Verify runner tools
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          xmake --version
          node --version
          python --version
          gh --version

      - name: Run release contract tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python tests/verify_ci_deploy.py
          python tests/verify_mask_catalog.py deploy/RadiationOverhaul.esp
          python tests/verify_mask_extras.py
          python tests/verify_hud_fallback.py deploy/PrismaUI_F4/views/Interface/FalloutAnomaly/hud_toxic.html src/RadHud.cpp
          python tests/verify_local_hud_editor.py
          python tests/verify_ae_runtime_support.py
          python tests/verify_ghoul_contract.py
          python tests/verify_storm_spawn_ownership.py
          python tests/verify_serialization_policy.py
          python tests/verify_rad_stack_integration.py
          python tests/verify_survival.py
          python tests/verify_survival_diseases.py
          python tests/verify_survival_menu.py
          python tests/verify_needs_globals.py
          python tests/verify_av_ownership.py
          python tests/verify_papyrus_pex.py

      - name: Configure (MSVC)
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($dir in @('build', 'build-msvc', '.xmake')) {
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          xmake f -p windows -a x64 -m release --builddir=build-msvc -y

      - name: Build and run release policy tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tests = @('rad_correctness_policy_tests', 'serialization_policy_tests')
          foreach ($t in $tests) { xmake build -y $t }
          foreach ($t in $tests) { & ".\build\tests\$t.exe" }

      - name: Build
        run: xmake build -vD -y FalloutAnomalyRadiation

      - name: Package mod archive
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-Item 'build/release/FalloutAnomalyRadiation.dll'
          Write-Host "using DLL: $($dll.FullName) ($($dll.Length) bytes)"
          $stage = Join-Path $env:GITHUB_WORKSPACE 'pkg'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Path 'deploy/*' -Destination $stage -Recurse
          $plugins = Join-Path $stage 'F4SE/Plugins'
          New-Item -ItemType Directory -Path $plugins -Force | Out-Null
          Copy-Item $dll.FullName (Join-Path $plugins 'FalloutAnomalyRadiation.dll')
          $asset = Join-Path $env:GITHUB_WORKSPACE $env:ASSET
          if (Test-Path $asset) { Remove-Item -Force $asset }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $asset
          if (-not (Test-Path $asset)) { throw "archive $asset was not created" }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $asset = Join-Path $env:GITHUB_WORKSPACE $env:ASSET
          $title = "Rad Overhaul $env:TAG"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:TAG --title $title --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'gh release edit failed' }
            gh release upload $env:TAG $asset --clobber
          } else {
            gh release create $env:TAG $asset --verify-tag --title $title --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh release publish failed' }
