name: Rad Overhaul build

on:
  pull_request:
    paths:
      - "Rad-Overhaul-Fallout-4/**"
      - ".github/workflows/rad-overhaul-build.yml"
  push:
    branches:
      - ci/rad-overhaul-build-validation
    paths:
      - "Rad-Overhaul-Fallout-4/**"
      - ".github/workflows/rad-overhaul-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rad-overhaul-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows native build (MSVC)
    runs-on: largepluginmods-windows
    defaults:
      run:
        shell: pwsh
    env:
      RAD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v4
        with:
          ref: ${{ env.RAD_HEAD_SHA }}

      - name: Verify exact PR head checkout
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:RAD_HEAD_SHA) {
            throw "expected exact head $env:RAD_HEAD_SHA but checked out $actual"
          }
          Write-Host "exact head: $actual"

      - name: Verify commonlib_NonVR reference
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $commonLibSha = 'ed383ff935eea00566a371eff0d6a97ae4bda548'
          $commonLib = $env:COMMONLIBF4_PATH
          if (-not $commonLib) { throw 'Runner COMMONLIBF4_PATH is not configured' }
          $pinned = (git -C $commonLib rev-parse HEAD).Trim()
          if ($pinned -ne $commonLibSha) { throw "commonlib_NonVR checkout $pinned does not match pin $commonLibSha" }
          if (git -C $commonLib status --porcelain --untracked-files=no) { throw 'CommonLib reference has tracked changes' }
          git -C $commonLib submodule foreach --recursive 'git diff --exit-code HEAD'
          $submodule = (git -C $commonLib submodule status --recursive) -join "`n"
          if ($submodule -match '(?m)^[+U-]') { throw 'CommonLib submodule does not match its pin' }
          if (-not (Test-Path (Join-Path $commonLib 'RE-Work') -PathType Container)) { throw 'CommonLib RE-Work marker missing' }
          Write-Host "commonlib_NonVR: $pinned"
          "COMMONLIBF4_PATH=$commonLib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify runner tools
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          xmake --version
          node --version
          python --version

      - name: Run contract tests
        working-directory: Rad-Overhaul-Fallout-4
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python --version
          python tests/verify_ci_deploy.py
          python tests/verify_mask_catalog.py deploy/RadiationOverhaul.esp
          python tests/verify_hud_fallback.py deploy/PrismaUI_F4/views/Interface/FalloutAnomaly/hud_toxic.html src/RadHud.cpp
          python tests/verify_local_hud_editor.py
          python tests/verify_ae_runtime_support.py
          python tests/verify_ghoul_contract.py
          python tests/verify_storm_spawn_ownership.py
          python tests/verify_serialization_policy.py
          python tests/verify_needs_consumption_trace.py
          python tests/verify_climate_runtime.py
          python tests/verify_climate_protection_config.py
          python tests/verify_climate_protection_runtime.py
          python tests/verify_climate_heat_config.py
          python tests/verify_climate_weather_config.py
          python tests/verify_climate_hud.py
          python tests/verify_hud_layout_bridge.py
          node tests/armor_diagnostics_tests.js
          node tests/status_hud_tests.js
          python tests/verify_rad_shelter_cache.py
          python tests/verify_rad_stack_integration.py
          python tests/verify_survival.py
          python tests/verify_needs_globals.py
          python tests/verify_av_ownership.py
          python tests/verify_papyrus_pex.py

      - name: Configure (MSVC)
        working-directory: Rad-Overhaul-Fallout-4
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          xmake f -p windows -a x64 -m release --builddir=build-msvc -y

      - name: Build and run policy tests
        working-directory: Rad-Overhaul-Fallout-4
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tests = @(
            'rad_correctness_policy_tests',
            'climate_policy_tests',
            'climate_weather_policy_tests',
            'climate_wetness_policy_tests',
            'needs_policy_tests',
            'needs_trace_policy_tests',
            'serialization_policy_tests'
          )
          foreach ($t in $tests) { xmake build -y $t }
          foreach ($t in $tests) { & ".\build\tests\$t.exe" }

      - name: Build
        working-directory: Rad-Overhaul-Fallout-4
        run: xmake build -vD -y FalloutAnomalyRadiation

      - name: Upload Windows DLL
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: FalloutAnomalyRadiation-windows-x64
          path: Rad-Overhaul-Fallout-4/build/release/FalloutAnomalyRadiation.dll
          if-no-files-found: error
          retention-days: 7
