name: Rad Overhaul release

# Builds the Windows DLL natively (MSVC) on the self-hosted Windows runner, packages the full mod
# (deploy/ tree + the freshly-built FalloutAnomalyRadiation.dll), and publishes
# a GitHub Release with the installable zip attached.
#
# Trigger: push a tag matching rad-overhaul-v*  (e.g. rad-overhaul-v1.0.0),
# or run manually via workflow_dispatch with an explicit version.

on:
  push:
    tags:
      - "rad-overhaul-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create/publish (e.g. rad-overhaul-v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rad-overhaul-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, package & publish (MSVC, self-hosted Windows)
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Resolve release tag
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.event.inputs.version || github.ref_name }}'
          if (-not $tag.StartsWith('rad-overhaul-v')) { throw "refusing to release non rad-overhaul-v* tag: $tag" }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ASSET=RadiationOverhaul-$tag.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout commonlib_NonVR (RE authority)
        env:
          COMMONLIB_READ_TOKEN: ${{ secrets.COMMONLIB_READ_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Rad Overhaul builds ONLY against PRISMA-USER-INTERFACE-FRAMEWORK/commonlib_NonVR (private) —
          # never Dear-Modding-FO4/CommonLibF4 or any other CommonLib. Bump this SHA deliberately.
          # (commonlib_NonVR pulls its own lib/commonlib-shared submodule; that is the fork's internal
          # dependency, not CommonLibF4.) Auth via the COMMONLIB_READ_TOKEN repo secret; Actions masks it.
          $commonLibSha = '6ab58418bdb639936265db713baf064b36560484'   # commonlib_NonVR main: AE CreateExplosionAtLocation (PR #103), public inventory event sources (PR #102), survival bindings
          $root = Split-Path -Parent (Split-Path -Parent $env:GITHUB_WORKSPACE)
          $commonLib = Join-Path $root 'commonlib_NonVR'
          foreach ($stale in @($commonLib, (Join-Path $root 'CommonLibF4'))) {
            if (Test-Path $stale) { Remove-Item -Recurse -Force $stale }
          }
          git init -q $commonLib
          git -C $commonLib remote add origin "https://x-access-token:$($env:COMMONLIB_READ_TOKEN)@github.com/PRISMA-USER-INTERFACE-FRAMEWORK/commonlib_NonVR.git"
          git -C $commonLib fetch -q --depth 1 origin $commonLibSha
          git -C $commonLib checkout -q FETCH_HEAD
          git -C $commonLib submodule update --init --recursive --depth 1
          $pinned = (git -C $commonLib rev-parse HEAD).Trim()
          if ($pinned -ne $commonLibSha) { throw "commonlib_NonVR checkout $pinned does not match pin $commonLibSha" }
          if (-not (Test-Path (Join-Path $commonLib 'RE-Work') -PathType Container)) {
            throw 'RE-Work marker missing — checkout is not commonlib_NonVR'
          }
          Write-Host "commonlib_NonVR: $pinned"
          "COMMONLIBF4_PATH=$commonLib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.4"

      - name: Setup Python for contract tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run release contract tests
        working-directory: Rad-Overhaul-Fallout-4
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python tests/verify_mask_catalog.py deploy/RadiationOverhaul.esp
          python tests/verify_hud_fallback.py deploy/PrismaUI_F4/views/Interface/FalloutAnomaly/hud_toxic.html src/RadHud.cpp
          python tests/verify_local_hud_editor.py
          python tests/verify_ae_runtime_support.py
          python tests/verify_ghoul_contract.py
          python tests/verify_storm_spawn_ownership.py
          python tests/verify_serialization_policy.py

      - name: Configure (MSVC)
        working-directory: Rad-Overhaul-Fallout-4
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($dir in @('build', 'build-msvc', '.xmake')) {
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          }
          xmake f -p windows -a x64 -m release --builddir=build-msvc -y

      - name: Build and run release policy tests
        working-directory: Rad-Overhaul-Fallout-4
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tests = @('rad_correctness_policy_tests', 'serialization_policy_tests')
          foreach ($t in $tests) { xmake build -y $t }
          foreach ($t in $tests) { & ".\build\tests\$t.exe" }

      - name: Build
        working-directory: Rad-Overhaul-Fallout-4
        run: xmake build -vD -y FalloutAnomalyRadiation

      - name: Package mod archive
        working-directory: Rad-Overhaul-Fallout-4
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-Item 'build/release/FalloutAnomalyRadiation.dll'
          Write-Host "using DLL: $($dll.FullName) ($($dll.Length) bytes)"
          $stage = Join-Path $env:GITHUB_WORKSPACE 'pkg'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Path 'deploy/*' -Destination $stage -Recurse
          $plugins = Join-Path $stage 'F4SE/Plugins'
          New-Item -ItemType Directory -Path $plugins -Force | Out-Null
          Copy-Item $dll.FullName (Join-Path $plugins 'FalloutAnomalyRadiation.dll')
          $asset = Join-Path $env:GITHUB_WORKSPACE $env:ASSET
          if (Test-Path $asset) { Remove-Item -Force $asset }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $asset
          Write-Host '--- archive contents (top) ---'
          Get-ChildItem -Path $stage -Depth 1 -Name | Sort-Object
          if (-not (Test-Path $asset)) { throw "archive $asset was not created" }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Join-Path $env:GITHUB_WORKSPACE $env:ASSET
          $notesFile = 'Rad-Overhaul-Fallout-4/RELEASE_NOTES.md'
          $notes = if (Test-Path $notesFile) { @('--notes-file', $notesFile) } else { @('--generate-notes') }
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if ($exists) {
            gh release upload $env:TAG $asset --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:TAG $asset --repo $env:GITHUB_REPOSITORY --title "Rad Overhaul $($env:TAG)" --target $env:GITHUB_SHA @notes
          }
