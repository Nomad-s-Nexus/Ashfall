name: Rad Overhaul release

# Builds the Windows DLL on the self-hosted runner, packages the full mod
# (deploy/ tree + the freshly-built FalloutAnomalyRadiation.dll), and publishes
# a GitHub Release with the installable zip attached.
#
# Trigger: push a tag matching rad-overhaul-v*  (e.g. rad-overhaul-v1.0.0),
# or run manually via workflow_dispatch with an explicit version.

on:
  push:
    tags:
      - "rad-overhaul-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create/publish (e.g. rad-overhaul-v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rad-overhaul-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, package & publish (clang-cl/xwin, self-hosted)
    runs-on: [self-hosted, Linux, X64, largepluginmods]
    env:
      XWIN_ROOT: ${{ vars.XWIN_ROOT || '/opt/xwin' }}

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.version || github.ref_name }}"
          case "$tag" in
            rad-overhaul-v*) ;;
            *) echo "refusing to release non rad-overhaul-v* tag: $tag" >&2; exit 1 ;;
          esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "ASSET=RadiationOverhaul-${tag}.zip" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout commonlib_NonVR (RE authority)
        shell: bash
        run: |
          set -euo pipefail
          # Release builds ONLY against PRISMA-USER-INTERFACE-FRAMEWORK/commonlib_NonVR — never
          # Dear-Modding-FO4/CommonLibF4 or any other CommonLib. Pinned to an immutable SHA for
          # reproducible releases (the commit adding the Rad natives). Bump deliberately.
          COMMONLIB_SHA="027179464c5ae399d231a568d3bb4bb4c36ba822"
          root="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          commonLib="$root/commonlib_NonVR"
          rm -rf "$commonLib" "$root/CommonLibF4"   # drop any stale Dear-Modding/other checkout too
          git init -q "$commonLib"
          git -C "$commonLib" remote add origin https://github.com/PRISMA-USER-INTERFACE-FRAMEWORK/commonlib_NonVR.git
          git -C "$commonLib" fetch -q --depth 1 origin "$COMMONLIB_SHA"
          git -C "$commonLib" checkout -q FETCH_HEAD
          git -C "$commonLib" submodule update --init --recursive --depth 1
          test -d "$commonLib/RE-Work" || { echo "ERROR: RE-Work marker missing — checkout is not commonlib_NonVR" >&2; exit 1; }
          echo "COMMONLIBF4_PATH=$commonLib" >> "$GITHUB_ENV"

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.4"

      - name: Verify xwin toolchain
        shell: bash
        run: |
          set -euo pipefail
          for tool in clang-cl lld-link llvm-ar llvm-rc llvm-dlltool xmake; do
            command -v "$tool"
          done
          for required in \
            "$XWIN_ROOT/crt/include" \
            "$XWIN_ROOT/sdk/include/ucrt" \
            "$XWIN_ROOT/sdk/lib/um/x86_64"; do
            test -d "$required" || { echo "missing xwin path: $required" >&2; exit 1; }
          done

      - name: Prepare case-correct xwin import libs
        shell: bash
        run: |
          set -euo pipefail
          shim="$GITHUB_WORKSPACE/.xwin-libshim"
          rm -rf "$shim"
          mkdir -p "$shim"
          for name in bcrypt version User32 Ole32 OleAut32 crypt32 Shell32; do
            src="$(find "$XWIN_ROOT/sdk/lib/um/x86_64" -iname "${name}.lib" | head -1)"
            [ -n "$src" ] || { echo "no staged ${name}.lib found under $XWIN_ROOT" >&2; exit 1; }
            ln -sf "$src" "$shim/${name}.lib"
          done
          echo "XWIN_LIBSHIM=$shim" >> "$GITHUB_ENV"

      - name: Configure (clang-cl / xwin)
        working-directory: Rad-Overhaul-Fallout-4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build build-clang .xmake
          xmake f -F xmake-xwin.lua -p windows -a x64 -m release --builddir=build-clang -y

      - name: Build
        working-directory: Rad-Overhaul-Fallout-4
        shell: bash
        run: xmake build -F xmake-xwin.lua -vD -y

      - name: Package mod archive
        working-directory: Rad-Overhaul-Fallout-4
        shell: bash
        run: |
          set -euo pipefail
          dll="$(find build/release build-clang build -type f -name FalloutAnomalyRadiation.dll 2>/dev/null | head -1)"
          [ -n "$dll" ] || { echo "built FalloutAnomalyRadiation.dll not found" >&2; exit 1; }
          echo "using DLL: $dll ($(stat -c %s "$dll") bytes)"

          stage="$GITHUB_WORKSPACE/pkg"
          rm -rf "$stage"
          mkdir -p "$stage"
          # deploy/ is the complete mod tree minus the compiled DLL
          cp -r deploy/. "$stage/"
          mkdir -p "$stage/F4SE/Plugins"
          cp "$dll" "$stage/F4SE/Plugins/FalloutAnomalyRadiation.dll"

          # Mod data lands at the archive root (F4SE/, Meshes/, Textures/, *.esp, ...)
          ( cd "$stage" && zip -r -X "$GITHUB_WORKSPACE/$ASSET" . )
          echo "--- archive contents (top) ---"
          ( cd "$stage" && find . -maxdepth 2 | sort )
          test -f "$GITHUB_WORKSPACE/$ASSET"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=(--generate-notes)
          if [ -f Rad-Overhaul-Fallout-4/RELEASE_NOTES.md ]; then
            notes=(--notes-file Rad-Overhaul-Fallout-4/RELEASE_NOTES.md)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$GITHUB_WORKSPACE/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$GITHUB_WORKSPACE/$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rad Overhaul $TAG" \
              --target "$GITHUB_SHA" \
              "${notes[@]}"
          fi
