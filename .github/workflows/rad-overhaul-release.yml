name: Rad Overhaul release

# Builds the Windows DLL natively (MSVC) on the self-hosted Windows runner, packages the full mod
# (deploy/ tree + the freshly-built FalloutAnomalyRadiation.dll), and publishes
# a GitHub Release with the installable zip attached.
#
# Trigger: push a tag matching rad-overhaul-v*  (e.g. rad-overhaul-v1.0.0),
# or run manually via workflow_dispatch with an explicit version.

on:
  push:
    tags:
      - "rad-overhaul-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create/publish (e.g. rad-overhaul-v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rad-overhaul-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, package & publish (MSVC, self-hosted Windows)
    runs-on: largepluginmods-windows
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Resolve release tag
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.event.inputs.version || github.ref_name }}'
          if (-not $tag.StartsWith('rad-overhaul-v')) { throw "refusing to release non rad-overhaul-v* tag: $tag" }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ASSET=RadiationOverhaul-$tag.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout repository
        uses: https://github.com/actions/checkout@v4

      - name: Verify commonlib_NonVR (RE authority)
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Constraint: the release builds against the same runner-provisioned checkout the PR build validates,
          # so the release path needs no repository secret and cannot clone over the shared authority checkout.
          # Rad Overhaul builds ONLY against PRISMA-USER-INTERFACE-FRAMEWORK/commonlib_NonVR (private),
          # never Dear-Modding-FO4/CommonLibF4 or any other CommonLib. Bump this SHA deliberately.
          $commonLibSha = 'ed383ff935eea00566a371eff0d6a97ae4bda548'   # commonlib_NonVR: AE CreateExplosionAtLocation 2192306 (#72), public inventory event sources, survival bindings
          $commonLib = $env:COMMONLIBF4_PATH
          if (-not $commonLib) { throw 'Runner COMMONLIBF4_PATH is not configured' }
          $pinned = (git -C $commonLib rev-parse HEAD).Trim()
          if ($pinned -ne $commonLibSha) { throw "commonlib_NonVR checkout $pinned does not match pin $commonLibSha" }
          if (git -C $commonLib status --porcelain --untracked-files=no) { throw 'CommonLib reference has tracked changes' }
          git -C $commonLib submodule foreach --recursive 'git diff --exit-code HEAD'
          $submodule = (git -C $commonLib submodule status --recursive) -join "`n"
          if ($submodule -match '(?m)^[+U-]') { throw 'CommonLib submodule does not match its pin' }
          if (-not (Test-Path (Join-Path $commonLib 'RE-Work') -PathType Container)) {
            throw 'RE-Work marker missing — checkout is not commonlib_NonVR'
          }
          Write-Host "commonlib_NonVR: $pinned"
          "COMMONLIBF4_PATH=$commonLib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify runner tools
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Constraint: xmake comes from the provisioned runner, like the PR build. A marketplace
          # setup action is not mirrored on this instance and fails to resolve before any step runs.
          xmake --version
          node --version
          python --version

      - name: Run release contract tests
        working-directory: Rad-Overhaul-Fallout-4
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python --version
          python tests/verify_ci_deploy.py
          python tests/verify_mask_catalog.py deploy/RadiationOverhaul.esp
          python tests/verify_mask_extras.py
          python tests/verify_hud_fallback.py deploy/PrismaUI_F4/views/Interface/FalloutAnomaly/hud_toxic.html src/RadHud.cpp
          python tests/verify_local_hud_editor.py
          python tests/verify_ae_runtime_support.py
          python tests/verify_ghoul_contract.py
          python tests/verify_storm_spawn_ownership.py
          python tests/verify_serialization_policy.py
          python tests/verify_survival.py
          python tests/verify_survival_diseases.py
          python tests/verify_survival_menu.py
          python tests/verify_needs_globals.py
          python tests/verify_av_ownership.py
          python tests/verify_papyrus_pex.py

      - name: Configure (MSVC)
        working-directory: Rad-Overhaul-Fallout-4
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($dir in @('build', 'build-msvc', '.xmake')) {
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          }
          xmake f -p windows -a x64 -m release --builddir=build-msvc -y

      - name: Build and run release policy tests
        working-directory: Rad-Overhaul-Fallout-4
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tests = @('rad_correctness_policy_tests', 'serialization_policy_tests')
          foreach ($t in $tests) { xmake build -y $t }
          foreach ($t in $tests) { & ".\build\tests\$t.exe" }

      - name: Build
        working-directory: Rad-Overhaul-Fallout-4
        run: xmake build -vD -y FalloutAnomalyRadiation

      - name: Package mod archive
        working-directory: Rad-Overhaul-Fallout-4
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-Item 'build/release/FalloutAnomalyRadiation.dll'
          Write-Host "using DLL: $($dll.FullName) ($($dll.Length) bytes)"
          $stage = Join-Path $env:GITHUB_WORKSPACE 'pkg'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Path 'deploy/*' -Destination $stage -Recurse
          $plugins = Join-Path $stage 'F4SE/Plugins'
          New-Item -ItemType Directory -Path $plugins -Force | Out-Null
          Copy-Item $dll.FullName (Join-Path $plugins 'FalloutAnomalyRadiation.dll')
          $asset = Join-Path $env:GITHUB_WORKSPACE $env:ASSET
          if (Test-Path $asset) { Remove-Item -Force $asset }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $asset
          Write-Host '--- archive contents (top) ---'
          Get-ChildItem -Path $stage -Depth 1 -Name | Sort-Object
          if (-not (Test-Path $asset)) { throw "archive $asset was not created" }

      - name: Publish release
        env:
          TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Constraint: the provisioned runner has no gh CLI, so the release is published through the
          # Forgejo API with the workflow token instead of depending on a tool the runner may not carry.
          $api = "$($env:GITHUB_SERVER_URL)/api/v1/repos/$($env:GITHUB_REPOSITORY)"          $tag = $env:TAG
          $asset = Join-Path $env:GITHUB_WORKSPACE $env:ASSET
          if (-not (Test-Path $asset)) { throw "archive $asset is missing" }
          $notesFile = 'Rad-Overhaul-Fallout-4/RELEASE_NOTES.md'
          $body = if (Test-Path $notesFile) { Get-Content $notesFile -Raw } else { '' }
          $auth = "Authorization: token $($env:TOKEN)"
          $payloadFile = Join-Path $env:GITHUB_WORKSPACE 'release.json'
          @{ tag_name = $tag; name = "Rad Overhaul $tag"; body = $body; draft = $false; prerelease = $false } |
            ConvertTo-Json -Depth 3 | Out-File -FilePath $payloadFile -Encoding utf8
          $release = $null
          try {
            $release = (curl.exe -sS -f -H $auth "$api/releases/tags/$tag") | ConvertFrom-Json
          } catch {
            $release = $null
          }
          if ($release) {
            curl.exe -sS -f -X PATCH -H $auth -H 'Content-Type: application/json' --data-binary "@$payloadFile" "$api/releases/$($release.id)" | Out-Null
            foreach ($existing in @($release.assets)) {
              if ($existing -and $existing.name -eq $env:ASSET) {
                curl.exe -sS -f -X DELETE -H $auth "$api/releases/$($release.id)/assets/$($existing.id)" | Out-Null
              }
            }
          } else {
            $release = (curl.exe -sS -f -X POST -H $auth -H 'Content-Type: application/json' --data-binary "@$payloadFile" "$api/releases") | ConvertFrom-Json
          }
          if (-not $release.id) { throw "release $tag could not be created or read" }
          curl.exe -sS -f -X POST -H $auth -F "attachment=@$asset" "$api/releases/$($release.id)/assets?name=$($env:ASSET)" | Out-Null
          Write-Host "published $tag with $($env:ASSET) ($((Get-Item $asset).Length) bytes)"
