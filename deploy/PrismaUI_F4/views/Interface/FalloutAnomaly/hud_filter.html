<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Breathing protection</title><link rel="stylesheet" href="hud_status.css"></head>
<body><div id="root"><div class="status" id="breath" role="img" aria-label="BREATH"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.081 20c1.612 0 2.919 -1.335 2.919 -2.98v-9.763c0 -.694 -.552 -1.257 -1.232 -1.257c-.205 0 -.405 .052 -.584 .15l-.13 .083c-1.46 1.059 -2.432 2.647 -3.404 5.824c-.42 1.37 -.636 2.962 -.648 4.775c-.012 1.675 1.261 3.054 2.877 3.161l.203 .007"/><path d="M17.92 20c-1.613 0 -2.92 -1.335 -2.92 -2.98v-9.763c0 -.694 .552 -1.257 1.233 -1.257c.204 0 .405 .052 .584 .15l.13 .083c1.46 1.059 2.432 2.647 3.405 5.824c.42 1.37 .636 2.962 .648 4.775c.012 1.675 -1.261 3.054 -2.878 3.161l-.202 .007"/><path d="M9 12a3 3 0 0 0 3 -3a3 3 0 0 0 3 3"/><path d="M12 4v5"/></svg><span class="label">BREATH</span><b id="breathValue">--</b></div><div class="status" id="filter" role="img" aria-label="FILTER"><svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle class="track" cx="24" cy="24" r="20"/><circle class="fill" id="filterRing" cx="24" cy="24" r="20" stroke-dasharray="125.66 125.66" transform="rotate(-90 24 24)"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v2.172a2 2 0 0 1 -.586 1.414l-4.414 4.414v7l-6 2v-8.5l-4.48 -4.928a2 2 0 0 1 -.52 -1.345v-2.227"/></svg><span class="label">FILTER</span><b id="filterValue">--</b><i class="key" id="filterKey" hidden></i></div><div class="status" id="mask" role="img" aria-label="MASK"><svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle class="track" cx="24" cy="24" r="20"/><circle class="fill" id="maskRing" cx="24" cy="24" r="20" stroke-dasharray="125.66 125.66" transform="rotate(-90 24 24)"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12"/></svg><span class="label">MASK</span><b id="maskValue">--</b><i class="key" id="maskKey" hidden></i></div><div class="status" id="auto" role="img" aria-label="AUTO MASK"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5 -3.2 7.6 -8 9c-4.8 -1.4 -8 -4.5 -8 -9v-6z"/><path d="M9 12l2 2l4 -4"/></svg><span class="label">AUTO</span><b id="autoValue">--</b></div></div><script>

var root=document.getElementById('root'),_visState=false,_preview=false,_lastAir=null,_lastFilter=null,_phos=false;
function pct(n){return Math.round(Math.max(0,Math.min(100,+n||0)));}
function num(n){n=+n;return isFinite(n)?n:-1;}
function ring(id,f,c){document.getElementById(id).setAttribute('stroke-dashoffset',(c*(1-Math.max(0,Math.min(1,f)))).toFixed(2));}
function renderFilter(){
 var a=_lastAir||{},d=_lastFilter||{},masked=_lastAir?!!a.masked:!!d.masked;
 var state=!a.contaminated?'CLEAN':a.sealed?'SEALED':a.sheltered?'COVERED':masked&&!a.failed?'FILTERED':'EXPOSED';
 var breath=document.getElementById('breath');
 document.getElementById('breathValue').textContent=state;
 breath.className='status '+(state==='EXPOSED'?'danger':a.contaminated?'warn':'');
 breath.setAttribute('aria-label','Breathing air: '+state);breath.title='Breathing air: '+state;
 var charge=masked?num(a.charge):-1,condition=masked?num(a.condition):-1;
 var degrading=false;
 [['filter',charge],['mask',condition]].forEach(function(pair){
  var e=document.getElementById(pair[0]),n=pct(pair[1]);
  e.hidden=!masked||pair[1]<0;
  e.className='status '+(n<=25?'danger':n<=60?'warn':'');
  if(_phos)ring(pair[0]+'Ring',n/100,125.66);
  document.getElementById(pair[0]+'Value').textContent=n+'%';
  if(masked&&pair[1]>=0&&n<100)degrading=true;
 });
 var am=a.autoMask,auto=document.getElementById('auto');
 auto.hidden=am===undefined;
 document.getElementById('autoValue').textContent=am===0?'OFF':am===2?'HELD':'ON';
 auto.className='status '+(am===0?'warn':'');
 var show=_preview||!!a.contaminated||!!a.failed||degrading;
 _visState=show;
 root.classList.toggle('on',show);
 window.reportVisibility(JSON.stringify({id:WIDGET_ID,visible:show}));
}
window.updateAir=function(json){try{_lastAir=typeof json==='string'?JSON.parse(json):json;if(!_preview)renderFilter();}catch(e){}};
window.updateFilter=function(json){try{_lastFilter=typeof json==='string'?JSON.parse(json):json;if(!_preview)renderFilter();}catch(e){}};
window.setEditorPreview=function(json){_preview=json==='1'||json===1||json===true;if(_preview){var a=_lastAir,d=_lastFilter;_lastAir={contaminated:true,masked:true,autoMask:1};_lastFilter={masked:true,charge:70,condition:85};renderFilter();_lastAir=a;_lastFilter=d;}else if(_lastAir||_lastFilter)renderFilter();else root.classList.remove('on');};
window.setTheme=function(name){_phos=String(name).replace(/"/g,'')==='phosphor';document.body.classList.toggle('theme-phosphor',_phos);if(_preview)window.setEditorPreview(1);else if(_lastAir||_lastFilter)renderFilter();};
window.setKeys=function(json){try{var k=(typeof json==='string'?JSON.parse(json):json)||{};[['filterKey',k.replace],['maskKey',k.repair]].forEach(function(p){var e=document.getElementById(p[0]);e.hidden=!p[1];e.textContent=p[1]?'['+p[1]+']':'';});}catch(e){}};

var WIDGET_ID='rad_filter';
var DEF={xf:22/1920,yf:1014/1080,wf:180/1920,hf:58/1080};   // default: bottom-left (original visor spot)
var _want=null,_lastW=0,_lastH=0;
function flushPos(){
  if(!_want)return;
  var W=window.innerWidth,H=window.innerHeight;
  if(!(W>1)||!(H>1))return;
  if(W===_lastW&&H===_lastH)return;
  var r=document.getElementById('root');
  r.style.left=(_want.xf*W)+'px';r.style.top=(_want.yf*H)+'px';
  var explicitSize=_want.w!==null&&_want.h!==null;
  r.style.width=explicitSize?Math.max(40,_want.w<=1?_want.w*W:_want.w)+'px':'';
  r.style.height=explicitSize?Math.max(20,_want.h<=1?_want.h*H:_want.h)+'px':'';
  r.style.setProperty('--s',explicitSize?1:_want.s);r.style.setProperty('--r',(_want.r||0)+'deg');
  window.reportPosition(JSON.stringify({id:WIDGET_ID,x:_want.xf,y:_want.yf,s:_want.s,r:_want.r||0}));
  _lastW=W;_lastH=H;
}
function applyPos(xf,yf,s,rot,w,h){
  _want={xf:xf,yf:yf,s:s,r:rot||0,
    w:(typeof w==='number'&&isFinite(w)&&w>0)?w:null,
    h:(typeof h==='number'&&isFinite(h)&&h>0)?h:null};
  _lastW=0;_lastH=0;
  flushPos();
}
try{new ResizeObserver(function(){flushPos();}).observe(document.documentElement);}catch(e){}
var _posSet=false;
window.setHUDPosition=function(json){
  _posSet=true;
  try{var p=(typeof json==='string')?JSON.parse(json):json;
    applyPos(p.x,p.y,(typeof p.s==='number'?p.s:1),(typeof p.r==='number'?p.r:0),
      (typeof p.w==='number'?p.w:null),(typeof p.h==='number'?p.h:null));}catch(e){}
};
window.setLocalHUDLayout=function(json){
  try{var p=(typeof json==='string')?JSON.parse(json):json;applyPos(p.x,p.y,p.s,p.r);_posSet=true;document.getElementById('root').style.display=p.hidden?'none':'';}catch(e){}
};
window.releaseLocalHUDLayout=function(){document.getElementById('root').style.display='';};
// no-op fallbacks if PrismaHUD hasn't injected these (e.g. PrismaHUD absent)
window.reportPosition   =window.reportPosition   ||function(){};
window.reportVisibility =window.reportVisibility ||function(){};
setTimeout(function(){if(!_posSet)applyPos(DEF.xf,DEF.yf,1,0);},50);
</script>
</body>
</html>
