<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Breathing protection</title><link rel="stylesheet" href="hud_status.css"></head>
<body><div id="root"><div class="status " id="breath" role="img" aria-label="BREATH"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18a5 5 0 0 1 0-10 7 7 0 0 1 13 0 5 5 0 0 1 0 10H5Zm3-7h8m-8 3h8"/></svg><span class="label">BREATH</span><b id="breathValue">--</b></div><div class="status " id="filter" role="img" aria-label="FILTER"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5V3Zm3 4h8m-8 5h8m-8 5h8"/></svg><span class="label">FILTER</span><b id="filterValue">--</b></div><div class="status " id="mask" role="img" aria-label="MASK"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v10l-5 6H9l-5-6V5Zm1 3h5v5H5m9-5h5v5h-5m-4 2h4v4h-4"/></svg><span class="label">MASK</span><b id="maskValue">--</b></div></div><script>

var root=document.getElementById('root'),_visState=false,_preview=false,_lastAir=null,_lastFilter=null;
function pct(n){return Math.round(Math.max(0,Math.min(100,+n||0)));}
function renderFilter(){
 var a=_lastAir||{},d=_lastFilter||{},masked=_lastAir?!!a.masked:!!d.masked;
 var state=!a.contaminated?'CLEAN':a.sealed?'SEALED':a.sheltered?'COVERED':masked&&!a.failed?'FILTERED':'EXPOSED';
 var breath=document.getElementById('breath');document.getElementById('breathValue').textContent=state;
 breath.className='status '+(state==='EXPOSED'?'danger':a.contaminated?'warn':'');breath.setAttribute('aria-label','Breathing air: '+state);breath.title='Breathing air: '+state;
 [['filter',_lastAir?a.charge:d.charge],['mask',_lastAir?a.condition:d.condition]].forEach(function(pair){var e=document.getElementById(pair[0]),n=pct(pair[1]);e.hidden=!masked||+pair[1]<0;e.className='status '+(n===0?'danger':n<=25?'warn':'');document.getElementById(pair[0]+'Value').textContent=n+'%';});
 _visState=true;root.classList.add('on');window.reportVisibility(JSON.stringify({id:WIDGET_ID,visible:true}));
}
window.updateAir=function(json){try{_lastAir=typeof json==='string'?JSON.parse(json):json;if(!_preview)renderFilter();}catch(e){}};
window.updateFilter=function(json){try{_lastFilter=typeof json==='string'?JSON.parse(json):json;if(!_preview)renderFilter();}catch(e){}};
window.setEditorPreview=function(json){_preview=json==='1'||json===1||json===true;if(_preview){var a=_lastAir,d=_lastFilter;_lastAir={contaminated:true,masked:true};_lastFilter={masked:true,charge:70,condition:85};renderFilter();_lastAir=a;_lastFilter=d;}else if(_lastAir||_lastFilter)renderFilter();else root.classList.remove('on');};

var WIDGET_ID='rad_filter';
var DEF={xf:22/1920,yf:1014/1080,wf:180/1920,hf:58/1080};   // default: bottom-left (original visor spot)
var _want=null,_lastW=0,_lastH=0;
function flushPos(){
  if(!_want)return;
  var W=window.innerWidth,H=window.innerHeight;
  if(!(W>1)||!(H>1))return;
  if(W===_lastW&&H===_lastH)return;
  var r=document.getElementById('root');
  r.style.left=(_want.xf*W)+'px';r.style.top=(_want.yf*H)+'px';
  var explicitSize=_want.w!==null&&_want.h!==null;
  r.style.width=explicitSize?Math.max(40,_want.w<=1?_want.w*W:_want.w)+'px':'';
  r.style.height=explicitSize?Math.max(20,_want.h<=1?_want.h*H:_want.h)+'px':'';
  r.style.setProperty('--s',explicitSize?1:_want.s);r.style.setProperty('--r',(_want.r||0)+'deg');
  window.reportPosition(JSON.stringify({id:WIDGET_ID,x:_want.xf,y:_want.yf,s:_want.s,r:_want.r||0}));
  _lastW=W;_lastH=H;
}
function applyPos(xf,yf,s,rot,w,h){
  _want={xf:xf,yf:yf,s:s,r:rot||0,
    w:(typeof w==='number'&&isFinite(w)&&w>0)?w:null,
    h:(typeof h==='number'&&isFinite(h)&&h>0)?h:null};
  _lastW=0;_lastH=0;
  flushPos();
}
try{new ResizeObserver(function(){flushPos();}).observe(document.documentElement);}catch(e){}
var _posSet=false;
window.setHUDPosition=function(json){
  _posSet=true;
  try{var p=(typeof json==='string')?JSON.parse(json):json;
    applyPos(p.x,p.y,(typeof p.s==='number'?p.s:1),(typeof p.r==='number'?p.r:0),
      (typeof p.w==='number'?p.w:null),(typeof p.h==='number'?p.h:null));}catch(e){}
};
window.setLocalHUDLayout=function(json){
  try{var p=(typeof json==='string')?JSON.parse(json):json;applyPos(p.x,p.y,p.s,p.r);_posSet=true;document.getElementById('root').style.display=p.hidden?'none':'';}catch(e){}
};
window.releaseLocalHUDLayout=function(){document.getElementById('root').style.display='';};
// no-op fallbacks if PrismaHUD hasn't injected these (e.g. PrismaHUD absent)
window.reportPosition   =window.reportPosition   ||function(){};
window.reportVisibility =window.reportVisibility ||function(){};
setTimeout(function(){if(!_posSet)applyPos(DEF.xf,DEF.yf,1,0);},50);
</script>
</body>
</html>
