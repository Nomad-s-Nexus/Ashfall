<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Vital status</title><link rel="stylesheet" href="hud_status.css"></head>
<body><div id="root"><div class="status fallback-only" id="health" role="img" aria-label="HEALTH"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/></svg><span class="label">HEALTH</span><b id="healthValue">--</b></div><div class="status fallback-only" id="stamina" role="img" aria-label="AP"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11"/></svg><span class="label">AP</span><b id="staminaValue">--</b></div><div class="status fallback-only" id="rads" role="img" aria-label="RADS"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 14.6l3 5.19a9 9 0 0 0 4.5 -7.79h-6a3 3 0 0 1 -1.5 2.6"/><path d="M13.5 9.4l3 -5.19a9 9 0 0 0 -9 0l3 5.19a3 3 0 0 1 3 0"/><path d="M10.5 14.6l-3 5.19a9 9 0 0 1 -4.5 -7.79h6a3 3 0 0 0 1.5 2.6"/></svg><span class="label">RADS</span><b id="radsValue">--</b></div><div class="status " id="tissue" role="img" aria-label="TISSUE"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12a5 5 0 1 0 10 0a5 5 0 1 0 -10 0"/><path d="M12 7v-4"/><path d="M11 3h2"/><path d="M15.536 8.464l2.828 -2.828"/><path d="M17.657 4.929l1.414 1.414"/><path d="M17 12h4"/><path d="M21 11v2"/><path d="M15.535 15.536l2.829 2.828"/><path d="M19.071 17.657l-1.414 1.414"/><path d="M12 17v4"/><path d="M13 21h-2"/><path d="M8.465 15.536l-2.829 2.828"/><path d="M6.343 19.071l-1.413 -1.414"/><path d="M7 12h-4"/><path d="M3 13v-2"/><path d="M8.464 8.464l-2.828 -2.828"/><path d="M4.929 6.343l1.414 -1.413"/></svg><span class="label">TISSUE</span><b id="tissueValue">--</b></div></div><script>

var root=document.getElementById('root'),_visState=false,_preview=false,_lastData=null;
function pct(n){return Math.round(Math.max(0,Math.min(100,+n||0)));}
function vital(id,value,severity,description){var e=document.getElementById(id);document.getElementById(id+'Value').textContent=pct(value)+'%';e.className='status '+severity;e.title=description;e.setAttribute('aria-label',description);}
function renderToxic(d){
 var fallback=!!d.fallback,t=Math.max(0,Math.min(1000,+d.tissue||0)),health=+d.healthMax>0?(+d.health||0)/d.healthMax*100:0,ap=+d.apMax>0?(+d.ap||0)/d.apMax*100:0;
 ['health','stamina','rads'].forEach(function(id){document.getElementById(id).hidden=!fallback;});
 vital('health',health,health<=25?'danger':health<=50?'warn':'','Health remaining');
 vital('stamina',ap,ap<=20?'warn':'','Action points remaining');
 vital('rads',(+d.rads||0)/Math.max(1,+d.radsMax||1000)*100,(+d.rads||0)>=600?'danger':'','Radiation blocks maximum health');
 vital('tissue',t/10,t>=600?'danger':t>=150?'warn':'','Tissue damage; permanent scarring '+Math.round(+d.permanentTissue||0));
 var show=fallback||t>0;_visState=show;root.classList.toggle('visible',show||_preview);window.reportVisibility(JSON.stringify({id:WIDGET_ID,visible:show||_preview}));
}
window.updateToxic=function(json){try{var d=typeof json==='string'?JSON.parse(json):json;if(!d||typeof d!=='object')return;_lastData=d;renderToxic(d);}catch(e){}};
window.setEditorPreview=function(json){_preview=json==='1'||json===1||json===true;if(_preview)renderToxic({fallback:true,health:180,healthMax:300,ap:80,apMax:100,rads:200,tissue:150});else if(_lastData)renderToxic(_lastData);else root.classList.remove('visible');};

var WIDGET_ID='rad_toxic';
var DEF={xf:30/1920,yf:882/1080,wf:240/1920,hf:58/1080};   // default: just below the rads widget
var _want=null,_lastW=0,_lastH=0;
function flushPos(){
  if(!_want)return;
  var W=window.innerWidth,H=window.innerHeight;
  if(!(W>1)||!(H>1))return;
  if(W===_lastW&&H===_lastH)return;
  var r=document.getElementById('root');
  r.style.left=(_want.xf*W)+'px';r.style.top=(_want.yf*H)+'px';
  var explicitSize=_want.w!==null&&_want.h!==null;
  r.style.width=explicitSize?Math.max(40,_want.w<=1?_want.w*W:_want.w)+'px':'';
  r.style.height=explicitSize?Math.max(20,_want.h<=1?_want.h*H:_want.h)+'px':'';
  r.style.setProperty('--s',explicitSize?1:_want.s);r.style.setProperty('--r',(_want.r||0)+'deg');
  window.reportPosition(JSON.stringify({id:WIDGET_ID,x:_want.xf,y:_want.yf,s:_want.s,r:_want.r||0}));
  _lastW=W;_lastH=H;
}
function applyPos(xf,yf,s,rot,w,h){
  _want={xf:xf,yf:yf,s:s,r:rot||0,
    w:(typeof w==='number'&&isFinite(w)&&w>0)?w:null,
    h:(typeof h==='number'&&isFinite(h)&&h>0)?h:null};
  _lastW=0;_lastH=0;
  flushPos();
}
try{new ResizeObserver(function(){flushPos();}).observe(document.documentElement);}catch(e){}
var _posSet=false;
window.setHUDPosition=function(json){
  _posSet=true;
  try{var p=(typeof json==='string')?JSON.parse(json):json;
    applyPos(p.x,p.y,(typeof p.s==='number'?p.s:1),(typeof p.r==='number'?p.r:0),
      (typeof p.w==='number'?p.w:null),(typeof p.h==='number'?p.h:null));}catch(e){}
};
window.setLocalHUDLayout=function(json){
  try{var p=(typeof json==='string')?JSON.parse(json):json;applyPos(p.x,p.y,p.s,p.r);_posSet=true;document.getElementById('root').style.display=p.hidden?'none':'';}catch(e){}
};
window.releaseLocalHUDLayout=function(){document.getElementById('root').style.display='';};
// no-op fallbacks if PrismaHUD hasn't injected these (e.g. PrismaHUD absent)
window.reportPosition   =window.reportPosition   ||function(){};
window.reportVisibility =window.reportVisibility ||function(){};
setTimeout(function(){if(!_posSet)applyPos(DEF.xf,DEF.yf,1,0);},50);
</script>
</body>
</html>
