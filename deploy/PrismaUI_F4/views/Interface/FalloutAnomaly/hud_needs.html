<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Needs status</title><link rel="stylesheet" href="hud_status.css"><script src="hud_core.js"></script></head>
<body class="theme-phosphor"><div id="root">
<div class="status" id="hunger" role="img" aria-label="Hunger: fine"><div class="core" id="hungerCore" style="--c:#93e8a4"></div></div>
<div class="status" id="thirst" role="img" aria-label="Thirst: fine"><div class="core" id="thirstCore" style="--c:#86e6ea"></div></div>
<div class="status" id="sleepDebt" role="img" aria-label="Fatigue: fine"><div class="core" id="sleepDebtCore" style="--c:#93e8a4"></div></div>
<div class="status" id="risk" role="img" aria-label="Disease exposure" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 12a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M11.939 14c0 .173 .048 .351 .056 .533l0 .217a4.75 4.75 0 0 1 -4.533 4.745l-.217 0m-4.75 -4.75a4.75 4.75 0 0 1 7.737 -3.693m6.513 8.443a4.75 4.75 0 0 1 -4.69 -5.503l-.06 0m1.764 -2.944a4.75 4.75 0 0 1 7.731 3.477l0 .217m-11.195 -3.813a4.75 4.75 0 0 1 -1.828 -7.624l.164 -.172m6.718 0a4.75 4.75 0 0 1 -1.665 7.798"/></svg><span class="label">EXPOSURE</span><b id="riskValue">--</b></div>
<div class="status" id="illness" role="img" aria-label="Illness: none" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12a5 5 0 1 0 10 0a5 5 0 1 0 -10 0"/><path d="M12 7v-4"/><path d="M11 3h2"/><path d="M15.536 8.464l2.828 -2.828"/><path d="M17.657 4.929l1.414 1.414"/><path d="M17 12h4"/><path d="M21 11v2"/><path d="M15.535 15.536l2.829 2.828"/><path d="M19.071 17.657l-1.414 1.414"/><path d="M12 17v4"/><path d="M13 21h-2"/><path d="M8.465 15.536l-2.829 2.828"/><path d="M6.343 19.071l-1.413 -1.414"/><path d="M7 12h-4"/><path d="M3 13v-2"/><path d="M8.464 8.464l-2.828 -2.828"/><path d="M4.929 6.343l1.414 -1.413"/></svg><span class="label">ILLNESS</span><b id="illnessValue">--</b></div>
</div><script>
var root=document.getElementById('root'),_preview=false,_lastData=null;
var STAGE1=34,STAGE2=67,STAGE3=90,_repVis=null;
var DISEASE_NAMES={1:'FEVER',2:'WASTING'};
var PHOS_WORDS={hunger:['SATED','PECKISH','HUNGRY','STARVING'],thirst:['QUENCHED','THIRSTY','PARCHED','DEHYDRATED'],sleepDebt:['RESTED','TIRED','DROWSY','EXHAUSTED']};
var PHOS_ICONS={hunger:['<path d="M8 4v6c0 1.2.9 2 2 2v8M10 4v5M12 4v6c0 1.2-.9 2-2 2M16.5 4c-1.6 0-2.5 2-2.5 5.5s1 3 2.5 3V20"/>','Food'],thirst:['<path d="M12 3.5c3.4 4.3 5.5 7.2 5.5 10.2a5.5 5.5 0 0 1-11 0c0-3 2.1-5.9 5.5-10.2z"/>','Water'],sleepDebt:['<path d="M15 4.5a8 8 0 1 0 4.8 11.7A7 7 0 0 1 15 4.5z"/>','Rest']};
var cores={};
['hunger','thirst','sleepDebt'].forEach(function(id){cores[id]=PhosCore.build(document.getElementById(id+'Core'),PHOS_ICONS[id][0],PHOS_ICONS[id][1]);});
function pct(n){return Math.round(Math.max(0,Math.min(100,+n||0)));}
function stageOf(v){return v<STAGE1?0:v<STAGE2?1:v<STAGE3?2:3;}
function renderNeeds(d){
 var always=d.always===true||d.always===1,any=always;
 [['hunger','Hunger'],['thirst','Thirst'],['sleepDebt','Sleep debt']].forEach(function(pair){
  var id=pair[0],value=pct(d[id]),stage=stageOf(value),e=document.getElementById(id),f=1-value/100;
  e.hidden=stage===0&&!always;
  e.className='status';
  var word=PHOS_WORDS[id][f>.66?0:f>.5?1:f>=.25?2:3];
  PhosCore.set(cores[id],f,word,f,f<.25?'crit':f<=.5?'warn':'');
  if(stage>0)any=true;
  var description=pair[1]+' '+value+'%, severity '+stage+' of 3';
  e.setAttribute('aria-label',description);e.title=description;
 });
 var risk=pct(d.risk),packed=Math.max(0,Math.min(23,Math.round(+d.disease||0)));
 var illId=Math.floor(packed/10),illStage=packed%10;
 var riskChip=document.getElementById('risk'),riskValue=document.getElementById('riskValue');
 riskChip.hidden=!(illId===0&&(risk>=50||_preview));
 riskChip.className='status '+(risk>=80?'danger':'warn');
 riskValue.textContent=risk+'%';
 riskChip.setAttribute('aria-label','Disease exposure '+risk+'%');
 riskChip.title='Disease exposure '+risk+'%';
 if(!riskChip.hidden)any=true;
 var illChip=document.getElementById('illness');
 illChip.hidden=illId===0;
 if(illId>0){
  var label=DISEASE_NAMES[illId]||'ILLNESS';
  document.getElementById('illnessValue').textContent=illStage>0?label+' '+illStage:label;
  illChip.className='status '+(illStage>=2?'danger':'warn');
  var illDescription=label+(illStage>0?', stage '+illStage+' of 3':', incubating');
  illChip.setAttribute('aria-label',illDescription);illChip.title=illDescription;
  any=true;
 }
 var show=any||_preview;
 root.classList.toggle('visible',show);
 if(show!==_repVis){_repVis=show;window.reportVisibility(JSON.stringify({id:WIDGET_ID,visible:show}));}
}
window.updateNeeds=function(json){
 try{
  var d=typeof json==='string'?JSON.parse(json):json;
  if(!d||typeof d!=='object'||!['hunger','thirst','sleepDebt'].every(function(id){return typeof d[id]==='number'&&isFinite(d[id]);}))return;
  _lastData=d;if(!_preview)renderNeeds(d);
 }catch(e){}
};
window.setEditorPreview=function(json){
 _preview=json==='1'||json===1||json===true;
 if(_preview)renderNeeds({hunger:40,thirst:72,sleepDebt:95,risk:64,disease:13});
 else if(_lastData)renderNeeds(_lastData);
 else root.classList.remove('visible');
};
window.setTheme=function(){};

var WIDGET_ID='rad_needs';
var DEF={xf:22/1920,yf:746/1080,wf:268/1920,hf:98/1080};
var _want=null,_lastW=0,_lastH=0;
function flushPos(){
  if(!_want)return;
  var W=window.innerWidth,H=window.innerHeight;
  if(!(W>1)||!(H>1))return;
  if(W===_lastW&&H===_lastH)return;
  root.style.left=(_want.xf*W)+'px';root.style.top=(_want.yf*H)+'px';
  var explicitSize=_want.w!==null&&_want.h!==null;
  root.style.width=explicitSize?Math.max(40,_want.w<=1?_want.w*W:_want.w)+'px':'';
  root.style.height=explicitSize?Math.max(20,_want.h<=1?_want.h*H:_want.h)+'px':'';
  root.style.setProperty('--s',explicitSize?1:_want.s);root.style.setProperty('--r',(_want.r||0)+'deg');
  window.reportPosition(JSON.stringify({id:WIDGET_ID,x:_want.xf,y:_want.yf,s:_want.s,r:_want.r||0}));
  _lastW=W;_lastH=H;
}
function applyPos(xf,yf,s,rot,w,h){_want={xf:xf,yf:yf,s:s,r:rot||0,w:(typeof w==='number'&&isFinite(w)&&w>0)?w:null,h:(typeof h==='number'&&isFinite(h)&&h>0)?h:null};_lastW=0;_lastH=0;flushPos();}
try{new ResizeObserver(function(){flushPos();}).observe(document.documentElement);}catch(e){}
var _posSet=false;
window.setHUDPosition=function(json){
  _posSet=true;
  try{var p=(typeof json==='string')?JSON.parse(json):json;
    applyPos(p.x,p.y,(typeof p.s==='number'?p.s:1),(typeof p.r==='number'?p.r:0),
      (typeof p.w==='number'?p.w:null),(typeof p.h==='number'?p.h:null));}catch(e){}
};
window.setLocalHUDLayout=function(json){
  try{var p=(typeof json==='string')?JSON.parse(json):json;applyPos(p.x,p.y,p.s,p.r);_posSet=true;document.getElementById('root').style.display=p.hidden?'none':'';}catch(e){}
};
window.releaseLocalHUDLayout=function(){document.getElementById('root').style.display='';};
window.reportPosition=window.reportPosition||function(){};
window.reportVisibility=window.reportVisibility||function(){};
setTimeout(function(){if(!_posSet)applyPos(DEF.xf,DEF.yf,1,0);},50);
</script>
</body>
</html>
