<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Climate status</title><link rel="stylesheet" href="hud_status.css"></head>
<body><div id="root"><div class="status " id="warm" role="img" aria-label="WARM"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14V5a3 3 0 0 1 6 0v9a5 5 0 1 1-6 0Zm3-7v10"/></svg><span class="label">WARM</span><b id="warmValue">--</b></div><div class="status " id="wet" role="img" aria-label="WET"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2S4 11 4 16a8 8 0 0 0 16 0c0-5-8-14-8-14Z"/></svg><span class="label">WET</span><b id="wetValue">--</b></div><div class="status " id="air" role="img" aria-label="TEMP"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14V5a3 3 0 0 1 6 0v9a5 5 0 1 1-6 0Zm3-7v10"/></svg><span class="label">TEMP</span><b id="airValue">--</b></div><div class="status " id="wind" role="img" aria-label="WIND"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h12a3 3 0 1 0-3-3M3 12h17a3 3 0 1 1-3 3M3 17h6a3 3 0 1 1-3 3"/></svg><span class="label">WIND</span><b id="windValue">--</b></div></div><script>

var root=document.getElementById('root'),_preview=false,_hasData=false,_fahrenheit=false,_lastData=null;
var names=['NORMAL','CHILLED','MILD','MODERATE','SEVERE','CRITICAL'];
function pct(n){return Math.round(Math.max(0,Math.min(100,+n||0)));}
function status(id,value,description,severity){
 var e=document.getElementById(id);document.getElementById(id+'Value').textContent=value;
 e.className='status '+(severity||'');e.setAttribute('aria-label',description);e.title=description;
}
function renderClimate(d){
 var s=Math.max(0,Math.min(5,Math.round(+d.stage||0))),core=+d.core||0,ambient=+d.ambient||0;
 var warmth=pct(d.warmth==null?(core-28)/9*100:d.warmth),wet=pct(d.wetness),wind=+d.wind||0;
 var trend=(+d.warming||0)-(+d.cooling||0);if((core>=37&&trend>0)||(core<=28&&trend<0))trend=0;var body=names[s]+(trend>.001?' / WARMING':trend<-.001?' / COOLING':' / STEADY');
 status('warm',warmth+'%'+(trend>.001?' \u2191':trend<-.001?' \u2193':''),body+(+d.heat>0?' / NEAR HEAT':''),s>=4?'danger':s>=1?'warn':'');
 status('wet',wet+'%',wet?'Wet clothing increases cooling':'Dry',wet>=75?'warn':'');
 status('air',ambient<=0?'FREEZING':ambient<10?'COLD':ambient<20?'COOL':'MILD','Ambient '+(_fahrenheit?(ambient*9/5+32).toFixed(1)+' F':ambient.toFixed(1)+' C')+' / '+body,ambient<=0?'warn':'');
 status('wind',wind<2?'CALM':wind<8?'BREEZE':wind<14?'WINDY':'STRONG','Wind increases cooling; shelter reduces exposure',wind>=14?'warn':'');
 root.className='visible s'+s;
}
window.updateClimate=function(json){try{var d=typeof json==='string'?JSON.parse(json):json;if(!d||typeof d!=='object')return;_lastData=d;renderClimate(d);_hasData=true;window.reportVisibility(JSON.stringify({id:WIDGET_ID,visible:true}));}catch(e){}};
window.setClimateUnit=function(json){_fahrenheit=json==='F'||json==='"F"';if(_lastData)renderClimate(_lastData);};
window.setEditorPreview=function(json){_preview=json==='1'||json===1||json===true;if(_preview)renderClimate({core:35.8,warmth:87,ambient:-4,wetness:62,heat:30,wind:12,stage:1});else if(_lastData)renderClimate(_lastData);else root.className='';};

var WIDGET_ID='rad_climate';
var DEF={xf:22/1920,yf:944/1080,wf:250/1920,hf:58/1080};
var _want=null,_lastW=0,_lastH=0;
function flushPos(){
  if(!_want)return;
  var W=window.innerWidth,H=window.innerHeight;
  if(!(W>1)||!(H>1))return;
  if(W===_lastW&&H===_lastH)return;
  root.style.left=(_want.xf*W)+'px';root.style.top=(_want.yf*H)+'px';
  var explicitSize=_want.w!==null&&_want.h!==null;
  root.style.width=explicitSize?Math.max(40,_want.w<=1?_want.w*W:_want.w)+'px':'';
  root.style.height=explicitSize?Math.max(20,_want.h<=1?_want.h*H:_want.h)+'px':'';
  root.style.setProperty('--s',explicitSize?1:_want.s);root.style.setProperty('--r',(_want.r||0)+'deg');
  window.reportPosition(JSON.stringify({id:WIDGET_ID,x:_want.xf,y:_want.yf,s:_want.s,r:_want.r||0}));
  _lastW=W;_lastH=H;
}
function applyPos(xf,yf,s,rot,w,h){_want={xf:xf,yf:yf,s:s,r:rot||0,w:(typeof w==='number'&&isFinite(w)&&w>0)?w:null,h:(typeof h==='number'&&isFinite(h)&&h>0)?h:null};_lastW=0;_lastH=0;flushPos();}
try{new ResizeObserver(function(){flushPos();}).observe(document.documentElement);}catch(e){}
var _posSet=false;
window.setHUDPosition=function(json){
  _posSet=true;
  try{var p=(typeof json==='string')?JSON.parse(json):json;
    applyPos(p.x,p.y,(typeof p.s==='number'?p.s:1),(typeof p.r==='number'?p.r:0),
      (typeof p.w==='number'?p.w:null),(typeof p.h==='number'?p.h:null));}catch(e){}
};
window.setLocalHUDLayout=function(json){
  try{var p=(typeof json==='string')?JSON.parse(json):json;applyPos(p.x,p.y,p.s,p.r);_posSet=true;document.getElementById('root').style.display=p.hidden?'none':'';}catch(e){}
};
window.releaseLocalHUDLayout=function(){document.getElementById('root').style.display='';};
window.reportPosition=window.reportPosition||function(){};
window.reportVisibility=window.reportVisibility||function(){};
setTimeout(function(){if(!_posSet)applyPos(DEF.xf,DEF.yf,1,0);},50);
</script>
</body>
</html>
