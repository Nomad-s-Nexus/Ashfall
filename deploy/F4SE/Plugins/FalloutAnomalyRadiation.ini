; ============================================================================
;  Fallout Anomaly - Radiation Overhaul : configuration
;  Edit these and load a save. The in-game debug menu opens with Left Shift + F8
;  (storm triggers, rad/tissue debug, gas-mask filter/condition tools).
;  NOTE: the old [HUD] section (ToggleKey, bar positions/colors) was removed
;  2026-07-03 - the vitals HUD moved to PrismaHUD_F4, which owns its own layout.
; ============================================================================

[Hud]
; Mode = auto | phosphor | classic. phosphor: PhosphorHUD draws health/AP/rads, so our duplicate
;        vitals are dropped and the needs/toxicity widgets restyle. auto picks phosphor when
;        PhosphorHUD.dll is loaded or its files are in Data\F4SE\Plugins. classic keeps our vitals.
Mode=auto

[Storm]
; ---------------------------------------------------------------------------
;  STORM FREQUENCY - if storms feel too frequent, raise these. This is the
;  first thing to tune.
; ---------------------------------------------------------------------------
; Enabled     = 0 turns the mod's own storms OFF entirely (you keep the radiation,
;               gas-mask, filter and choking systems, just no scheduled storms).
; MinMinutes / MaxMinutes = gap between storms, in REAL minutes of actual play
;               (not game-time), so it does NOT change with your modlist's
;               timescale. A random gap in this range is rolled after each storm.
;               Defaults 35-90. For much rarer storms try 90-180 (or higher).
; VanillaRadstormGapMinutes = the BASE GAME chains its own radstorms every few
;               minutes; we thin them out by letting one through, then forcing
;               clear weather on any vanilla radstorm that rolls in within this
;               window. Raise it if vanilla radstorms still feel constant.
; DomeLeadMinutes = the storm dome appears ALONE and silent first (a "something's coming"
;               visual warning) for this many REAL minutes before the alarm sounds and the
;               dust/fog/effects roll in. Default 3. Set 0 for no lead (alarm immediately);
;               set low (e.g. 0.25 = 15s) for quick testing.
Enabled=1
MinMinutes=35.0
MaxMinutes=90.0
VanillaRadstormGapMinutes=60
DomeLeadMinutes=3.0

[Filter]
; Gas-mask filter system. Drains while the mask is worn; replace (hotkey or auto) by consuming a
; "Gas Mask Filter" item. A depleted filter chokes you (rads) in rad weather.
; ReplaceKey = Windows virtual-key code, decimal (117) or 0x-hex (0x75). 0 = disabled.
;            Default F6 (117): a 20-minute filter would otherwise strand you with no way to refill it.
;            Rejected with a log line (that action then disabled): F8 (the debug menu), mouse buttons
;            1-6, Shift, Esc, unparsable text. If both keys end up equal, BOTH are disabled so load
;            order cannot decide. Edits are re-read when you next open the Shift+F8 debug menu, so no
;            restart is needed; there is no in-game rebinding screen yet.
;            The key only consumes OUR "Gas Mask Filter"; another mask mod's filters are not read.
DurationSeconds=1200
ReplaceKey=117
AutoReplace=0
ChokeRadsPerSec=8.0

[Condition]
; Gas-mask condition/durability. The mask takes damage when the player is struck; at 0 it is broken
; and stops protecting (chokes you in rad weather) until repaired by consuming a "Gas Mask Repair Kit".
; RepairKey = Windows virtual-key code, decimal or 0x-hex. 0 = disabled.
;            Same validation as ReplaceKey: a duplicate disables both keys, and the same reserved keys
;            are rejected. Re-read when the debug menu opens.
;            The key only consumes OUR "Gas Mask Repair Kit"; another mask mod's kits are not read.
Enabled=1
DamagePerHit=6.0
RepairKey=118
AutoRepair=0

[Choking]
; Breathing rad weather without working protection damages HEALTH (on top of the vanilla rads).
; Applies while exposed outdoors: full rate with no mask, HealthPerSecond*FailedMaskFactor when
; masked but the filter is dead or the mask broken. Power armor, powered shelters, and being
; sheltered are exempt. Sounds = the METRO EXODUS choking one-shots.
Enabled=1
HealthPerSecond=1.5
FailedMaskFactor=0.5
Sounds=1

[Ambient]
; Looping ambient audio beds (all exterior-only; interiors are silent).
;  - Each storm type plays its own bed while its weather is active and you are outdoors. This is
;    driven by the current weather, so forcing a storm from the debug menu (weather:N) plays it too.
;  - A general background bed plays quietly in any exterior when no storm is up.
; Volume / StormVolume are 0..100 (100 = loudest, 0 = silent). Enabled=0 disables the general bed
; only (storm beds still play with their storms).
Enabled=1
Volume=45
StormVolume=85

[Masks]
; Extra gas masks from OTHER mods. Our own set is recognised by the FARO_GasMask keyword in
; RadiationOverhaul.esp; these two keys add gear from other plugins without editing their records,
; so the protection, filter, condition and choking systems work with them too.
;   ExtraKeywords = mask KEYWORD records, as Plugin.esp:0xLOCALID (comma-separated).
;                   An armor that fills the MOUTH slot and carries that keyword counts as a mask.
;   ExtraMasks    = armor records directly, as Plugin.esp:0xLOCALID (comma-separated).
;                   A listed armor counts as a mask whatever biped slot it fills (eye-slot masks).
; LOCALID is the form id as the plugin stores it (its own small 0x00xxxx-0xFFFFFF range), not the
; load-order form id. An entry whose plugin is absent, or whose form is missing, is logged and skipped.
; Gasmask Overhaul (Nexus 108845): PPM-88 mask keyword + armor, so both slot layouts cover it.
ExtraKeywords=Gasmask Overhaul.esp:0x011001
ExtraMasks=Gasmask Overhaul.esp:0x011004
; InferFromRadResist = 1 also recognises ANY mouth-slot armor that resists radiation (>= MinRadResist),
; so most mask mods then need no entry above. Set 0 to keep only the list and the known masks.
InferFromRadResist=1
MinRadResist=10

[Relief]
; Survival food/drink relief extras. The quest classifies food by the vanilla ObjectType keywords;
; these lists add items or keywords from OTHER mods without editing their records or ours. Entries are
; Plugin.esp:0xLOCALID (comma-separated), the plugin-local id, not the load-order id. A missing plugin or
; form is logged and skipped; malformed entries are counted in the log. No HC_* form is read.
; The list is resolved once per game session: edits to [Relief] need a game restart to take effect.
;   ExtraFoodKeywords / ExtraThirstKeywords = KEYWORD records; an item carrying one counts for that pool.
;   ExtraFoodItems / ExtraThirstItems       = specific ALCH records (the only items the engine consumes via a
;                                            use event) that give that pool relief; a trailing ; comment is stripped.
ExtraFoodKeywords=
ExtraThirstKeywords=
ExtraFoodItems=
; RefreshingBeverage 0x058AB8 and MS17DeezerLemonade 0x0E9284 are vanilla ALCH drinks that only carry
; HC_SustenanceType_QuenchesThirst; listing them here gives the thirst relief the HC_* keyword would.
ExtraThirstItems=Fallout4.esm:0x058AB8,Fallout4.esm:0x0E9284

[NeedsTrace]
; Diagnostic only. Enabled=1 logs player equip, inventory-count, container and magic-effect events
; as ordered [NeedsTrace] records for the survival-needs consumption matrix. It changes no game state.
; Leave at 0 for normal play.
Enabled=0

[Water]
; Enabled=1 fills one empty bottle when the player sneak-activates a drinking water source (pumps,
; sinks, fountains, water coolers) while holding an empty bottle. The bottle list and source list
; are built into the plugin; no HC_* Survival record is read or written. The output is Dirty Water
; everywhere except inside Vault 81, which gives Purified Water; a HUD message reports every fill.
; RequireModifier=1 means the player must be sneaking; a normal activation just drinks and never
; consumes a bottle. This differs from vanilla Survival, whose HC_FillWaterBottlePerk fills a bottle
; on a plain activation without sneaking. Set 0 to fill on every activation instead (not recommended).
; SkipWhenVanillaSurvival=1 leaves filling to vanilla when the game is in Survival difficulty (6),
; matching RadSurvivalQuest.SkipWhenVanillaSurvival, so a bottle is never filled twice.
Enabled=1
SkipWhenVanillaSurvival=1
RequireModifier=1

[Survival]
; Live survival-rate overrides. The debug menu (SURVIVAL tab) writes these as you move the sliders; you can
; also edit them by hand and they are read at game start. A missing or empty key keeps the quest default.
;   RateMultiplier   scales all three pool rates (default 1.0, range 0 to 5). Lower it if a slow timescale
;                    makes needs outrun you.
;   HourlyHunger / HourlyThirst / HourlySleepDebt   pool gain per game hour (defaults 0.05 / 0.10 / 0.025).
;   FoodScale / DrinkScale   relief per item portion (defaults 0.20 / 0.25).
; Values are clamped to their range; anything that is not a plain number is ignored and logged.
RateMultiplier=
HourlyHunger=
HourlyThirst=
HourlySleepDebt=
FoodScale=
DrinkScale=
